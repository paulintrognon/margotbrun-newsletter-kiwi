server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---------------------------------------------------------------
    # Frozen static archive of newsletter.margotbrun.com.
    # Clean routes (/oiseaux, /quiz, /liste, ...) map to .html files.
    # No SPA fallback: unknown paths return a real 404.
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-lived caching for fingerprinted media, fonts and stylesheets.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|jpg|jpeg|png|gif|ico|svg|webp|mp3|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
